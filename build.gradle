plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.WG'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// MySQL
	implementation 'mysql:mysql-connector-java:8.0.33'

	// Lombok
	implementation 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ⚠️ 파라미터 이름 유지 설정 추가 (Spring @PathVariable 등 오류 방지)
tasks.withType(JavaCompile) {
	options.compilerArgs += '-parameters'
}

// ✅ React 프론트 빌드 연동
def frontendDir = "$projectDir/src/main/frontend"

sourceSets {
	main {
		resources {
			srcDirs = ["$projectDir/src/main/resources"]
		}
	}
}

processResources {
	dependsOn "copyReactBuildFiles"
}

tasks.register("installReact", Exec) {
	workingDir = file(frontendDir)
	inputs.dir(frontendDir)
	group = BasePlugin.BUILD_GROUP

	commandLine = System.getProperty("os.name").toLowerCase().contains("windows") ?
			["cmd", "/c", "npm install"] : ["sh", "-c", "npm install"]
}

tasks.register("buildReact", Exec) {
	dependsOn("installReact")
	workingDir = file(frontendDir)
	inputs.dir(frontendDir)
	group = BasePlugin.BUILD_GROUP

	commandLine = System.getProperty("os.name").toLowerCase().contains("windows") ?
			["cmd", "/c", "npm run build"] : ["sh", "-c", "npm run build"]
}

tasks.register("copyReactBuildFiles", Copy) {
	dependsOn("buildReact")
	from("$frontendDir/build")
	into("$projectDir/src/main/resources/static")
}
